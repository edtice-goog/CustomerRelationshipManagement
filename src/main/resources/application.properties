# --- Storage ---
# Local development uses SQLite. Production (AWS) swaps this for RDS, e.g.:
#   crm.db.url=jdbc:postgresql://<rds-endpoint>:5432/crm
# (add the org.postgresql:postgresql driver dependency and a DDL variant in Database.java)
crm.db.url=jdbc:sqlite:data/crm.db

# --- Identity ---
# The CRM owner: excluded from customer focus in extraction, and the default owner
# of implicit next-step commitments generated by the activity rule.
crm.owner=Ed Tice

# --- Extraction ---
crm.extraction.model=claude-opus-4-8
# Observations at or above this confidence go live immediately; below it they wait in the review queue.
crm.autoPromoteThreshold=0.8

# --- Housekeeping (entity dedup with durable decision records) ---
# Merge verdicts at/above autoMergeThreshold execute automatically; keep-separate verdicts
# at/above autoKeepThreshold are recorded as decided. Everything else waits for human review.
crm.housekeeping.autoMergeThreshold=0.9
crm.housekeeping.autoKeepThreshold=0.7
# Daily sweep at 03:00 (Quartz cron). Housekeeping also runs opportunistically whenever
# extraction creates an entity with a name similar to an existing one.
crm.housekeeping.cron=0 0 3 * * ?

# --- Activities ---
# Minimum model confidence for a communication to join/create an evaluation activity.
crm.activities.evaluationThreshold=0.7
# Daily check: any open activity without an active linked commitment gets an implicit
# next-step commitment (also enforced whenever a related document is processed).
crm.activities.nextStepCron=0 30 3 * * ?

# --- Commitments ---
# Minimum model confidence to auto-mark a commitment fulfilled by an incoming communication.
crm.commitments.fulfillmentThreshold=0.8

# --- HTTP ---
quarkus.http.port=8080

# --- API description (for agents / Copilot) ---
# OpenAPI 3 spec: http://localhost:8080/q/openapi   Interactive docs: http://localhost:8080/q/swagger-ui
quarkus.swagger-ui.always-include=true
# Only the JSON API belongs in the spec; the HTML pages are for humans.
mp.openapi.scan.exclude.classes=com.edtice.crm.web.PagesResource
quarkus.smallrye-openapi.info-title=Customer Success CRM API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Agent-facing ingestion API. Flow: POST /api/claude/test to verify \
connectivity, POST /api/ingest with raw communication text, then poll GET /api/documents/{id} until status \
is 'extracted'. Extraction identifies people, organizations, contact details, and sentiment automatically.
