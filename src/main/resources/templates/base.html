<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{#insert title}Customer Success CRM{/}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2937; --muted: #6b7280;
    --accent: #2563eb; --border: #e5e7eb;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0.7rem 1.5rem;
           display: flex; align-items: baseline; gap: 1.5rem; }
  header .brand { font-weight: 700; font-size: 1.05rem; }
  header a { color: var(--ink); text-decoration: none; }
  header nav a { color: var(--muted); margin-right: 1rem; }
  header nav a:hover { color: var(--accent); }
  .badge { background: var(--warn); color: white; border-radius: 10px; padding: 0 0.5em; font-size: 0.8rem; }
  main { max-width: 1080px; margin: 1.5rem auto; padding: 0 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 1.1rem 1.3rem; margin-bottom: 1.3rem; }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.7rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 0.4rem 0.6rem;
       border-bottom: 1px solid var(--border); }
  td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  a { color: var(--accent); }
  textarea { width: 100%; min-height: 10rem; font-family: Consolas, monospace; font-size: 0.88rem;
             border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; }
  input[type=text] { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 0.45rem 0.6rem; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px;
           padding: 0.45rem 1rem; cursor: pointer; font-size: 0.9rem; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.danger { background: var(--bad); }
  form.inline { display: inline; }
  .muted { color: var(--muted); }
  .mono { font-family: Consolas, monospace; font-size: 0.85rem; }
  .pill { display: inline-block; border-radius: 999px; padding: 0.05rem 0.6rem; font-size: 0.78rem; }
  .pill.active { background: #dcfce7; color: var(--ok); }
  .pill.pending_review { background: #fef3c7; color: var(--warn); }
  .pill.rejected, .pill.error { background: #fee2e2; color: var(--bad); }
  .pill.staged, .pill.processing { background: #e0e7ff; color: #4338ca; }
  .pill.extracted { background: #dcfce7; color: var(--ok); }
  .pill.green { background: #dcfce7; color: var(--ok); }
  .pill.yellow { background: #fef3c7; color: var(--warn); }
  .pill.red { background: #fee2e2; color: var(--bad); }
  .pill.unassessed { background: #e5e7eb; color: var(--muted); }
  .sentiment.positive { color: var(--ok); font-weight: 600; }
  .sentiment.negative { color: var(--bad); font-weight: 600; }
  .sentiment.neutral { color: var(--muted); }
  pre.raw { white-space: pre-wrap; background: #f3f4f6; border-radius: 6px; padding: 1rem;
            font-size: 0.85rem; overflow-x: auto; }
  .evidence { font-style: italic; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <span class="brand"><a href="/">Customer Success CRM</a></span>
  <nav>
    <a href="/">Customers</a>
    <a href="/cases">Cases</a>
    <a href="/review">Review queue {#if pendingCount > 0}<span class="badge">{pendingCount}</span>{/if}</a>
  </nav>
</header>
<main>
{#insert /}
</main>
</body>
</html>
