---
openapi: 3.1.0
components:
  schemas:
    ActivityDetailDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        state:
          type: string
        label:
          type: string
        token:
          type: string
        reference:
          type: string
        primaryEntityId:
          type: integer
          format: int64
        opportunityId:
          type: integer
          format: int64
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentStatus"
        commitments:
          type: array
          items:
            $ref: "#/components/schemas/CommitmentDto"
        currentStatus:
          $ref: "#/components/schemas/AssessmentDto"
        assessmentHistory:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentDto"
    ActivityInfoDto:
      description: "Present when the communication carries a support-ticket token\
        \ (e.g. a SalesForce ref:...:ref thread token). Evaluation activities are\
        \ detected during extraction and appear on the document's activities afterward,\
        \ not in this synchronous response."
      type: object
      properties:
        activityId:
          type: integer
          format: int64
        kind:
          type: string
        label:
          type: string
        token:
          type: string
        newlyTracked:
          type: boolean
        documentCount:
          type: integer
          format: int32
        instructions:
          type: string
    ActivitySummaryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        state:
          type: string
        label:
          type: string
        token:
          type: string
        reference:
          type: string
        primaryEntityId:
          type: integer
          format: int64
        opportunityId:
          type: integer
          format: int64
        documentCount:
          type: integer
          format: int32
        currentStatus:
          $ref: "#/components/schemas/AssessmentDto"
        hasNextStep:
          type: boolean
    AssessmentDto:
      type: object
      properties:
        health:
          type: string
        customerDisposition:
          type: string
        customerDispositionNotes:
          type: string
        technicalProgress:
          type: string
        technicalProgressNotes:
          type: string
        rootCauseProgress:
          type: string
        rootCauseNotes:
          type: string
        summary:
          type: string
        assessedAt:
          $ref: "#/components/schemas/Instant"
        triggeredByDocument:
          type: integer
          format: int64
    ClaudeConfig:
      description: "Optional Claude API credentials. When omitted, the server's default\
        \ (ANTHROPIC_API_KEY environment variable) is used. Supply these to route\
        \ extraction through a different key/endpoint, e.g. a corporate agreement.\
        \ Never persisted."
      type: object
      properties:
        baseUrl:
          type: string
          description: "Alternative Claude API base URL, e.g. a corporate gateway.\
            \ Optional."
          examples:
          - https://api.anthropic.com
        apiKey:
          type: string
          description: API key to use for this request's extraction. Optional.
    CommitmentDto:
      type: object
      properties:
        observationId:
          type: integer
          format: int64
        owedByEntityId:
          type: integer
          format: int64
        owedByName:
          type: string
        value:
          type: string
        status:
          type: string
        implicit:
          type: boolean
        sourceDocId:
          type: integer
          format: int64
    DecideRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          description: "'merge' to fold the two entities together, 'keep_separate'\
            \ to record they are distinct."
        note:
          type: string
          description: Optional note appended to the record's reasoning.
    DocumentStatus:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sourceType:
          type: string
        status:
          type: string
        error:
          type: string
        receivedAt:
          $ref: "#/components/schemas/Instant"
        activityIds:
          type: array
          items:
            type: integer
            format: int64
    EntityRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        merged:
          type: boolean
    HousekeepingDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        status:
          type: string
        evidence:
          type: string
        reasoning:
          type: string
        decidedBy:
          type: string
        confidence:
          type: number
          format: double
        priorRecordId:
          type: integer
          format: int64
        createdAt:
          $ref: "#/components/schemas/Instant"
        decidedAt:
          $ref: "#/components/schemas/Instant"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityRef"
    IngestRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: "The full raw communication text (email, chat message, note),\
            \ verbatim."
        sourceType:
          type: string
          description: "Where this came from, e.g. outlook_email, teams_chat. Defaults\
            \ to 'api'."
        externalId:
          type: string
          description: "Stable id for deduplication (message id, etc). Defaults to\
            \ a hash of content."
        metadataJson:
          type: string
          description: "Optional metadata as a JSON string (sender, date, subject...).\
            \ Stored with the document."
        claude:
          $ref: "#/components/schemas/ClaudeConfig"
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    LinkOpportunityRequest:
      type: object
      properties:
        opportunityId:
          type: integer
          format: int64
    OpportunityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        guid:
          type: string
        name:
          type: string
        externalSystem:
          type: string
        externalRef:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
        attributes:
          type: object
          additionalProperties:
            type: string
    OpportunityRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name for the opportunity.
        externalSystem:
          type: string
          description: "External system holding the real opportunity record, e.g.\
            \ 'salesforce'. Omit for a local opportunity."
        externalRef:
          type: string
          description: The opportunity's id/reference in the external system.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Initial key-value attributes for local opportunities.
    TeamsIngestRequest:
      type: object
      properties:
        teamName:
          type: string
          description: "Team name, for channel conversations."
        channelName:
          type: string
          description: "Channel name, for channel conversations."
        chatName:
          type: string
          description: "Chat name or participant list, for 1:1 / group chats."
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TeamsMessage"
          description: "The messages of the conversation window, in chronological\
            \ order. Send a window with enough context — single chat messages are\
            \ rarely meaningful alone. Overlapping windows are safe: when messageIds\
            \ are present, the same window is deduplicated on re-submission."
        externalId:
          type: string
          description: Stable id for deduplication. Defaults to a hash of the message
            ids (or the transcript).
        claude:
          $ref: "#/components/schemas/ClaudeConfig"
      required:
      - messages
    TeamsMessage:
      type: object
      properties:
        messageId:
          type: string
          description: The Teams message id — used for deduplication when present.
        sender:
          type: string
          description: Display name of the sender.
        senderEmail:
          type: string
          description: Sender's email/UPN if known — greatly improves entity resolution.
        timestamp:
          type: string
          description: "Message timestamp as a string, passed through verbatim."
        text:
          type: string
          description: The message text.
      required:
      - sender
      - text
    TestResult:
      type: object
      properties:
        ok:
          type: boolean
        detail:
          type: string
paths:
  /api/activities:
    get:
      summary: List tracked activities
      description: "Support cases, evaluations, and relationship activities share\
        \ one structure. Filter with ?kind=support|evaluation|relationship and ?state=open|closed.\
        \ hasNextStep=false on an open activity means the next-step rule will generate\
        \ an implicit commitment."
      parameters:
      - name: kind
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivitySummaryDto"
      tags:
      - Api Resource
  /api/activities/{id}:
    get:
      summary: "Get an activity with documents, commitments, and full assessment history"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetailDto"
      tags:
      - Api Resource
  /api/activities/{id}/close:
    post:
      summary: Mark an activity complete
      description: Unconditional for now. Retires the activity's open implicit commitments
        (a closed activity needs no next step); real extracted promises stay active.
        A future restriction may keep evaluations open until their opportunity is
        won or lost.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummaryDto"
      tags:
      - Api Resource
  /api/activities/{id}/opportunity:
    post:
      summary: Link an activity to an opportunity (null opportunityId unlinks)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkOpportunityRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummaryDto"
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/activities/{id}/reassess:
    post:
      summary: Force an activity status recalculation from the full document history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeConfig"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/activities/{id}/reopen:
    post:
      summary: Reopen a closed activity
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummaryDto"
      tags:
      - Api Resource
  /api/claude/test:
    post:
      summary: Test Claude API connectivity
      description: Makes a free count_tokens call against the Claude API using the
        supplied credentials (or the server default when the body is empty/omitted).
        Call this before submitting content to confirm the key and endpoint work.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeConfig"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/commitments/{id}/fulfill:
    post:
      summary: Manually mark a commitment fulfilled
      description: "For commitments handled outside email, e.g. on a phone call. Per\
        \ the next-step rule, fulfilling the last active commitment on an open activity\
        \ immediately generates a fresh implicit commitment to set the next step."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      tags:
      - Api Resource
  /api/documents/{id}:
    get:
      summary: Get a staged document's extraction status
      description: "Status values: staged, processing, extracted, error. activityIds\
        \ lists the activities this document is linked to (support cases, evaluations)."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatus"
      tags:
      - Api Resource
  /api/documents/{id}/reprocess:
    post:
      summary: Re-run extraction for a staged document
      description: "Useful after an error, or to re-extract with improved prompts.\
        \ Optionally supply Claude credentials in the body."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeConfig"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/housekeeping:
    get:
      summary: List housekeeping records
      description: "The durable history of data-hygiene deliberations (entity merges\
        \ considered, with evidence and reasoning either way). Filter with ?status=open|merged|kept_separate."
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HousekeepingDto"
      tags:
      - Api Resource
  /api/housekeeping/run:
    post:
      summary: Run a housekeeping sweep now
      description: "Compares all entities pairwise for likely duplicates and deliberates\
        \ on each candidate pair (evidence, verdict, reasoning — recorded either way).\
        \ Also runs on a schedule and opportunistically on ingestion. Synchronous;\
        \ may take a while when there are many candidate pairs. Optionally supply\
        \ Claude credentials in the body."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeConfig"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/housekeeping/{id}/decide:
    post:
      summary: Decide an open housekeeping record
      description: "Human decision on a pair the agent left open: merge or keep_separate.\
        \ The decision and optional note become part of the permanent record."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/ingest:
    post:
      summary: Ingest a communication
      description: "Stages the raw text and starts background extraction (people,\
        \ organizations, contact details, sentiment, commitments, activity linkage).\
        \ Returns the staged document id; poll /api/documents/{id} for extraction\
        \ status and linked activities. Duplicate submissions (same externalId or\
        \ same content) are detected and not re-processed."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/ingest/teams:
    post:
      summary: Ingest a Microsoft Teams conversation window
      description: "Analogous to /api/ingest for email, shaped for chat: accepts a\
        \ batch of Teams messages (a conversation window) with sender/timestamp per\
        \ message, renders them into one transcript document, and runs the same extraction\
        \ pipeline — people, sentiment, commitments, evaluation detection, commitment\
        \ fulfillment. Returns the staged document id; poll /api/documents/{id}."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamsIngestRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/opportunities:
    get:
      summary: List opportunities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpportunityDto"
      tags:
      - Api Resource
    post:
      summary: Create a generic opportunity anchor
      description: "This CRM is deliberately not an opportunity-management system.\
        \ An opportunity is a GUID plus either external-system metadata (externalSystem\
        \ + externalRef) or, for users without one, a local key-value attribute bag.\
        \ Anything richer belongs in a real opportunity system."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDto"
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/opportunities/{id}:
    get:
      summary: Get an opportunity with its attributes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDto"
      tags:
      - Api Resource
  /api/opportunities/{id}/attributes:
    put:
      summary: Upsert key-value attributes on a local opportunity
      description: Keys are merged; existing keys are overwritten. Setting a key to
        empty string keeps the key.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDto"
        "400":
          description: Bad Request
      tags:
      - Api Resource
  /api/ping:
    get:
      summary: Liveness check
      description: Confirms the CRM itself is up. Does not touch the Claude API.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"
      tags:
      - Api Resource
info:
  title: Customer Success CRM API
  version: 0.1.0
  description: "Agent-facing ingestion API. Flow: POST /api/claude/test to verify\
    \ connectivity, POST /api/ingest with raw communication text, then poll GET /api/documents/{id}\
    \ until status is 'extracted'. Extraction identifies people, organizations, contact\
    \ details, and sentiment automatically."
